# Non-sensitive runtime configuration. Copy to config.yaml for local use.

public_source_api:
  base_url: "http://127.0.0.1:4100"
  # The collector refresh crawls every public endpoint (13 of them, Playwright
  # included). Observed runs take 180-220s, so a 180s timeout aborted the read
  # while the refresh was still succeeding server-side.
  request_timeout_seconds: 420
  page_size: 500
  source_slugs: []

wechat_read_api:
  enabled: true
  base_url: "http://127.0.0.1:4100"
  request_timeout_seconds: 60
  page_size: 200

minimax_api:
  model: "MiniMax-M2.7"
  base_url: "https://api.minimax.chat/v1"
  timeout_seconds: 300
  max_retries: 3
  selection_temperature: 0.2
  rewrite_temperature: 0.4
  selection_batch_size: 40
  rewrite_batch_size: 4
  rewrite_batch_size_cap: 4
  selection_max_tokens: 10000
  rewrite_max_tokens: 10000
  use_content_if_available: true
  fetch_article_detail_for_rewrite: false
  max_content_chars: 2000

bge_model:
  path: "data/models/bge-small-zh-v1.5"
  name: "BAAI/bge-small-zh-v1.5"
  allow_remote_download: false
  threshold: 0.85
  enabled: true
  force_gc_after_run: true

runtime:
  # Daily report window: yesterday 00:00 through tomorrow 00:00, Asia/Shanghai.
  report_window: "previous_and_current_calendar_day"
  default_no_publish: false
  reuse_rewrite_cache: true

wechat_publish:
  thumb_media_id: "OBa7s7v5pJj8C3xsRSuJHCEQh-fegLrmZO3jteVu4mfr3-OUP7ncJS5hw8Otzk2f"
  auto_publish: true
  author: "Valkyrie"

review_list:
  feishu_enabled: true
  feishu_user_id: "ou_5c3a069d031b2ac966bf04bfa6b822e7"
  include_time_filter: false
  include_quality_filter: true
  include_keyword_filter: true

output:
  database_path: "data/news.db"
  save_raw_json: true
  save_processed_json: true
  save_html: true
  app_log_path: "logs/app_{date}.log"
  llm_log_path: "logs/llm_{date}.jsonl"
  stop_publish_on_llm_error: true
  stop_publish_on_rewrite_warning: true
  require_rewritten_title_and_summary: true
  copy_check_threshold: 50
  max_review_ratio_for_publish: 5.0
  min_publishable_items: 0
